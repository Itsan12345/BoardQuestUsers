# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Keep 1 instance warm to eliminate cold-start lag and autoscale up to 4 instances
  # (4 instances x 80 concurrency = 320 simultaneous in-flight requests) for 100-250+ concurrent users.
  minInstances: 1
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 1024
