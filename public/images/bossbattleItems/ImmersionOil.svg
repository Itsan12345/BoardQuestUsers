<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- Outer dark pixel outline -->
  <rect x="6" y="1" width="4" height="1" fill="#1a0f07"/>
  <rect x="5" y="2" width="1" height="2" fill="#1a0f07"/>
  <rect x="10" y="2" width="1" height="2" fill="#1a0f07"/>
  <rect x="4" y="4" width="2" height="1" fill="#1a0f07"/>
  <rect x="10" y="4" width="2" height="1" fill="#1a0f07"/>
  <rect x="5" y="5" width="1" height="2" fill="#1a0f07"/>
  <rect x="10" y="5" width="1" height="2" fill="#1a0f07"/>
  <rect x="4" y="7" width="1" height="1" fill="#1a0f07"/>
  <rect x="11" y="7" width="1" height="1" fill="#1a0f07"/>
  <rect x="3" y="8" width="1" height="5" fill="#1a0f07"/>
  <rect x="12" y="8" width="1" height="5" fill="#1a0f07"/>
  <rect x="4" y="13" width="1" height="1" fill="#1a0f07"/>
  <rect x="11" y="13" width="1" height="1" fill="#1a0f07"/>
  <rect x="5" y="14" width="6" height="1" fill="#1a0f07"/>

  <!-- Rubber dropper bulb -->
  <rect x="6" y="2" width="4" height="2" fill="#b45309"/>
  <rect x="6" y="2" width="2" height="1" fill="#f59e0b"/>

  <!-- Bottle collar -->
  <rect x="6" y="4" width="4" height="1" fill="#fde68a"/>
  <rect x="6" y="5" width="4" height="2" fill="#92400e"/>
  <rect x="6" y="5" width="1" height="2" fill="#d97706"/>

  <!-- Glass bottle body & golden immersion oil -->
  <rect x="5" y="7" width="6" height="1" fill="#fef3c7"/>
  <rect x="4" y="8" width="8" height="2" fill="#fbbf24"/>
  <rect x="4" y="10" width="8" height="3" fill="#f59e0b"/>
  <rect x="5" y="13" width="6" height="1" fill="#d97706"/>

  <!-- Specular glass shine & oil refraction -->
  <rect x="5" y="8" width="1" height="3" fill="#ffffff"/>
  <rect x="6" y="8" width="1" height="1" fill="#fef3c7"/>
  <rect x="7" y="10" width="2" height="2" fill="#fde047"/>

  <!-- Sparkle droplet on top-right -->
  <rect x="13" y="3" width="1" height="3" fill="#fde047"/>
  <rect x="12" y="4" width="3" height="1" fill="#ffffff"/>
</svg>

