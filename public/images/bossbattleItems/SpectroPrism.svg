<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- Incoming light beam (left) -->
  <rect x="1" y="8" width="3" height="1" fill="#ffffff"/>
  <rect x="2" y="9" width="2" height="1" fill="#e0f2fe"/>

  <!-- Dispersed spectrum rays (right) -->
  <rect x="12" y="5" width="3" height="1" fill="#ef4444"/>
  <rect x="12" y="6" width="3" height="1" fill="#f59e0b"/>
  <rect x="12" y="7" width="3" height="1" fill="#fde047"/>
  <rect x="12" y="8" width="3" height="1" fill="#22c55e"/>
  <rect x="12" y="9" width="3" height="1" fill="#38bdf8"/>
  <rect x="12" y="10" width="3" height="1" fill="#a855f7"/>

  <!-- Prism dark pixel outline -->
  <rect x="7" y="2" width="2" height="1" fill="#0f172a"/>
  <rect x="6" y="3" width="1" height="2" fill="#0f172a"/>
  <rect x="9" y="3" width="1" height="2" fill="#0f172a"/>
  <rect x="5" y="5" width="1" height="2" fill="#0f172a"/>
  <rect x="10" y="5" width="1" height="2" fill="#0f172a"/>
  <rect x="4" y="7" width="1" height="3" fill="#0f172a"/>
  <rect x="11" y="7" width="1" height="3" fill="#0f172a"/>
  <rect x="3" y="10" width="1" height="3" fill="#0f172a"/>
  <rect x="12" y="10" width="1" height="3" fill="#0f172a"/>
  <rect x="3" y="13" width="10" height="1" fill="#0f172a"/>

  <!-- Prism crystal facets -->
  <rect x="7" y="3" width="2" height="2" fill="#e0f2fe"/>
  <rect x="6" y="5" width="4" height="2" fill="#bae6fd"/>
  <rect x="5" y="7" width="6" height="3" fill="#7dd3fc"/>
  <rect x="4" y="10" width="8" height="3" fill="#38bdf8"/>

  <!-- Inner refraction highlight & core -->
  <rect x="7" y="4" width="1" height="8" fill="#ffffff"/>
  <rect x="6" y="7" width="1" height="5" fill="#e0f2fe"/>
  <rect x="8" y="8" width="2" height="1" fill="#fde047"/>
  <rect x="8" y="9" width="2" height="1" fill="#4ade80"/>
  <rect x="8" y="10" width="3" height="2" fill="#0284c7"/>
</svg>

